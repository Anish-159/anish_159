# Render service manifest (example). Replace placeholders before using.
services:
  - type: web
    name: korean-ai-academy-server
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        scope: private
      - key: JWT_SECRET
        scope: private
      - key: PRODUCTION_CLIENT_URL
        scope: private
