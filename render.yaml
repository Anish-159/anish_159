services:
  - type: web
    name: korean-ai-academy-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PRODUCTION_CLIENT_URL
        value: https://learnzkorean.netlify.app
      - key: CLIENT_URL
        value: https://learnzkorean.netlify.app
      - key: PORT
        value: 5000

